<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Royal de Ségou – Commande en ligne</title>
<style>
:root{--bg:#f1f4ef;--surface:#fff;--text:#14201a;--muted:#5d6f64;--line:#dbe3da;--brand:#0f3d2e;--brand-text:#fff;--sun:#f2b705;--sun-text:#1d1600;--err:#b42318;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1612;--surface:#16231d;--text:#eef3ee;--muted:#9db0a4;--line:#2a3b32;--brand:#0a2a20;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1612;--surface:#16231d;--text:#eef3ee;--muted:#9db0a4;--line:#2a3b32;--brand:#0a2a20;--err:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding-bottom:96px}
main,header>div{max-width:560px;margin:0 auto;padding:0 16px}
header{background:var(--brand);color:var(--brand-text);padding:28px 0 24px}
h1{font-size:2rem;line-height:1.1;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
header p{margin:0;opacity:.85}
h2{font-size:1.15rem;margin:28px 0 4px;font-weight:800}
.row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.ico{flex:none;width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--line)}
.info{flex:1;min-width:0}
.info b{display:block}
.info span{display:block;color:var(--muted);font-size:.9rem}
.info em{font-style:normal;font-weight:700;font-size:.95rem}
button{font:inherit;cursor:pointer}
.add{flex:none;border:2px solid var(--brand);background:transparent;color:var(--text);border-radius:999px;padding:8px 16px;font-weight:700}
.step{flex:none;display:flex;align-items:center;gap:4px;background:var(--brand);color:var(--brand-text);border-radius:999px}
.step button{width:38px;height:38px;border:0;background:transparent;color:inherit;font-size:1.3rem;font-weight:700}
.step output{min-width:20px;text-align:center;font-weight:700}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
#bar button,.send{display:flex;width:100%;max-width:528px;margin:0 auto;justify-content:space-between;align-items:center;background:var(--sun);color:var(--sun-text);border:0;border-radius:14px;padding:15px 18px;font-weight:800;font-size:1.05rem;text-decoration:none}
#sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#sheet>div{max-width:560px;margin:0 auto}
#sheet[hidden],#bar[hidden]{display:none}
.top{display:flex;justify-content:space-between;align-items:center}
.top h2{margin:0}
.close{border:0;background:var(--surface);color:var(--text);width:40px;height:40px;border-radius:50%;font-size:1.2rem;border:1px solid var(--line)}
.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;padding:14px 0}
label{display:block;margin:14px 0 6px;font-weight:700;font-size:.95rem}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.err{color:var(--err);font-weight:600;min-height:1.4em;margin:12px 0 0}
.hint{color:var(--muted);font-size:.9rem;margin:10px 0 0}
.send{margin-top:8px;justify-content:center}
.send.alt{background:transparent;color:var(--text);border:2px solid var(--brand)}
.ph{display:grid;place-items:center;font-size:1.8rem}
</style>
</head>
<body>
<header><div>
<h1 id="nom">Royal de Ségou</h1>
<p>Choisissez vos plats, on vous les livre chez vous.</p>
</div></header>
<main id="menu"></main>

<div id="bar" hidden><button id="open"><span id="count"></span><span id="sum"></span></button></div>

<div id="sheet" hidden><div>
<div class="top"><h2>Ma commande</h2><button class="close" id="close" aria-label="Fermer">✕</button></div>
<div id="lines"></div>
<div class="total"><span>Total des plats</span><span id="tot"></span></div>
<label for="n">Votre nom</label><input id="n" autocomplete="name">
<label for="t">Votre numéro de téléphone</label><input id="t" type="tel" autocomplete="tel">
<label for="a">Adresse de livraison (quartier, repère)</label><textarea id="a" rows="2"></textarea>
<label for="p">Paiement à la livraison</label>
<select id="p"><option>Espèces</option><option>Orange Money</option><option>Moov Money</option></select>
<label for="k">Précision (facultatif)</label><input id="k" placeholder="Ex. : sans piment">
<p class="err" id="err" role="alert"></p>
<a class="send" id="send" target="_blank" rel="noopener"></a>
<p class="hint">WhatsApp s’ouvre avec votre commande déjà écrite. Il suffit d’appuyer sur envoyer. Les frais de livraison sont confirmés par le restaurant.</p>
</div></div>

const ALL=MENU.flatMap(g=>g.items), Q={};
const $=id=>document.getElementById(id);
const F=n=>n.toLocaleString("fr-FR").replace(/[\u202f\u00a0]/g," ")+" F";
document.title=CONFIG.nom+" – Commande en ligne"; $("nom").textContent=CONFIG.nom;

function ctrl(i){return Q[i.id]
 ?`<div class="step"><button data-m="${i.id}" aria-label="Retirer un ${i.n}">−</button><output>${Q[i.id]}</output><button data-a="${i.id}" aria-label="Ajouter un ${i.n}">+</button></div>`
 :`<button class="add" data-a="${i.id}">Ajouter</button>`}
function draw(){
 $("menu").innerHTML=MENU.map(g=>`<h2>${g.c}</h2>`+g.items.map(i=>
 `<div class="row">${IMG[i.id]?`<img class="ico" src="${IMG[i.id]}" alt="${i.n}" loading="lazy">`:`<div class="ico ph">🍽️</div>`}<div class="info"><b>${i.n}</b><em>${F(i.p)}</em></div>${ctrl(i)}</div>`).join("")).join("");
 const items=ALL.filter(i=>Q[i.id]), n=items.reduce((s,i)=>s+Q[i.id],0), t=items.reduce((s,i)=>s+Q[i.id]*i.p,0);
 $("bar").hidden=!n||!$("sheet").hidden;
 $("count").textContent="Voir ma commande ("+n+")"; $("sum").textContent=F(t);
 $("lines").innerHTML=items.map(i=>`<div class="line"><span>${Q[i.id]} × ${i.n}</span><span>${F(Q[i.id]*i.p)}</span></div>`).join("");
 $("tot").textContent=F(t);
 if(!n&&!$("sheet").hidden){$("sheet").hidden=true}
 link();
}
function link(){
 const items=ALL.filter(i=>Q[i.id]), t=items.reduce((s,i)=>s+Q[i.id]*i.p,0);
 const m=["🍽️ *Nouvelle commande – "+CONFIG.nom+"*","",
 "Client : "+$("n").value.trim(),"Téléphone : "+$("t").value.trim(),"Adresse : "+$("a").value.trim(),"Paiement : "+$("p").value,"",
 ...items.map(i=>Q[i.id]+" × "+i.n+" – "+F(Q[i.id]*i.p)),"","*Total des plats : "+F(t)+"*"];
 if($("k").value.trim())m.push("","Précision : "+$("k").value.trim());
 const tx=encodeURIComponent(m.join("\n"));$("send").href="https://wa.me/"+CONFIG.tels[0]+"?text="+tx;
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button"); if(!b)return;
 if(b.dataset.a){Q[b.dataset.a]=(Q[b.dataset.a]||0)+1;draw()}
 else if(b.dataset.m){Q[b.dataset.m]--;if(!Q[b.dataset.m])delete Q[b.dataset.m];draw()}
});
$("open").onclick=()=>{$("sheet").hidden=false;$("bar").hidden=true;scrollTo(0,0)};
$("close").onclick=()=>{$("sheet").hidden=true;draw()};
document.querySelectorAll("#sheet input,#sheet textarea,#sheet select").forEach(el=>el.addEventListener("input",link));
$("send").addEventListener("click",e=>{
 const miss=!$("n").value.trim()||!$("t").value.trim()||!$("a").value.trim();
 if(miss){e.preventDefault();$("err").textContent="Indiquez votre nom, votre téléphone et votre adresse pour envoyer la commande."}
 else $("err").textContent="";
});
$("send").textContent="Envoyer ma commande sur WhatsApp";
draw();
</script>
